
name: Test Fortnite API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose API access
        env:
          API_KEY: ${{ secrets.FORTNITE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${API_KEY:-}" ]; then
            echo "SECRET MISSING"
            exit 1
          fi

          echo "Secret detected. Testing endpoints..."

          for ENDPOINT in shop events/global; do
            if [ "$ENDPOINT" = "shop" ]; then
              URL="https://prod.api-fortnite.com/api/v1/shop"
            else
              URL="https://prod.api-fortnite.com/api/v1/events/global"
            fi

            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "x-api-key: $API_KEY" "$URL")

            echo "$ENDPOINT : HTTP $STATUS"
          done
